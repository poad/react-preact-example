packages:
  - basic

allowBuilds:
  esbuild: false
  unrs-resolver: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.18.0

overrides:
  chokidar: '>=5'
  esbuild@<=0.24.2: ^0.25.0
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@>=7.0.0 <11.0.1: ^9.0.9
  semver: '>=7'

trustPolicy: no-downgrade
