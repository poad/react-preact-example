packages:
  - react-router
  - react-router-cloudfront-spa/app
  - react-router-cloudfront-spa/cdk
  - react-router-cloudfront-spa/cdk/function
  - signals

allowBuilds:
  esbuild: false
  unrs-resolver: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.12.1

overrides:
  chokidar: '>=5'
  compression@<1.8.2: ^1.8.2
  semver: '>=7'

trustPolicy: no-downgrade
